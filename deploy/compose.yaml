name: hive-telemetry

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive # local development only
      POSTGRES_DB: hive
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/,
      # so the volume is mounted one level up.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d hive"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      # Subscribing to a broker status topic proves the broker accepts clients.
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
